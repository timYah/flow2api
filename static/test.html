<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow2API 模型测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e1e6; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 8px; font-size: 24px; color: #7c8aff; }
.subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }

.config-bar {
  display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
  background: #1a1b26; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2b3a;
}
.config-bar label { font-size: 13px; color: #888; white-space: nowrap; }
.config-bar input { flex: 1; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.config-note { margin-bottom: 20px; font-size: 12px; color: #7f8498; }

.main-layout { display: flex; gap: 20px; }
.sidebar { width: 280px; flex-shrink: 0; }
.content { flex: 1; min-width: 0; }

.model-section { margin-bottom: 16px; }
.section-title {
  font-size: 13px; font-weight: 600; color: #7c8aff; padding: 8px 12px;
  background: #1a1b26; border-radius: 8px 8px 0 0; border: 1px solid #2a2b3a; border-bottom: none;
  cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center;
}
.section-title:hover { background: #1e1f2e; }
.section-title .arrow { transition: transform 0.2s; }
.section-title.collapsed .arrow { transform: rotate(-90deg); }
.model-list {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 0 0 8px 8px;
  max-height: 300px; overflow-y: auto;
}
.model-list.hidden { display: none; }
.model-item {
  padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #1e1f2e;
  display: flex; justify-content: space-between; align-items: center;
}
.model-item:last-child { border-bottom: none; }
.model-item:hover { background: #1e1f2e; }
.model-item.active { background: #2a2b5a; color: #7c8aff; }
.model-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500;
}
.tag-image { background: #1a3a2a; color: #4ade80; }
.tag-video { background: #3a2a1a; color: #fb923c; }

.gen-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px;
}
.gen-panel h3 { font-size: 16px; margin-bottom: 4px; }
.gen-panel .model-info { font-size: 12px; color: #666; margin-bottom: 16px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.form-group textarea {
  width: 100%; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6;
  padding: 10px 12px; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px;
  font-family: inherit;
}
.form-group textarea:focus { outline: none; border-color: #7c8aff; }

.image-upload-area {
  border: 2px dashed #2a2b3a; border-radius: 8px; padding: 20px; text-align: center;
  cursor: pointer; transition: border-color 0.2s; position: relative;
}
.image-upload-area:hover { border-color: #7c8aff; }
.image-upload-area.has-images { padding: 10px; }
.image-upload-hint { color: #555; font-size: 13px; }
.image-preview-list { display: flex; gap: 8px; flex-wrap: wrap; }
.image-preview-item {
  position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden;
}
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .remove-btn {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%;
  cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
}

.btn-generate {
  width: 100%; padding: 12px; background: #7c8aff; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
}
.btn-generate:hover { background: #6b79ee; }
.btn-generate:disabled { background: #3a3b5a; cursor: not-allowed; }

.output-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px; margin-top: 16px;
}
.output-panel h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-idle { background: #555; }
.status-running { background: #facc15; animation: pulse 1s infinite; }
.status-done { background: #4ade80; }
.status-error { background: #f87171; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.output-log {
  background: #0f1117; border-radius: 8px; padding: 12px; font-size: 13px;
  line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  word-break: break-all; color: #aaa;
}
.output-result { margin-top: 12px; }
.output-result img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
.output-result video { max-width: 100%; border-radius: 8px; margin-top: 8px; }

.count-selector {
  display: flex; gap: 8px; background: #0f1117; padding: 4px; border-radius: 8px; border: 1px solid #2a2b3a;
}
.count-btn {
  flex: 1; padding: 8px 12px; background: transparent; color: #888; border: 1px solid transparent;
  border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-align: center;
}
.count-btn:hover { color: #e1e1e6; background: #1a1b26; }
.count-btn.active { background: #2a2b5a; color: #7c8aff; border-color: #7c8aff; font-weight: 600; }
.count-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.image-grid {
  display: grid; gap: 12px; margin-top: 12px;
}
.image-grid[data-cols="1"] { grid-template-columns: 1fr; }
.image-grid[data-cols="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.image-grid[data-cols="3"], .image-grid[data-cols="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) {
  .image-grid[data-cols="2"], .image-grid[data-cols="3"], .image-grid[data-cols="4"] { grid-template-columns: 1fr; }
}

.image-card {
  position: relative; background: #0f1117; border: 1px solid #2a2b3a; border-radius: 8px;
  overflow: hidden; display: flex; flex-direction: column;
}
.image-card-header {
  display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
  background: #141520; font-size: 12px; color: #888; border-bottom: 1px solid #2a2b3a;
}
.image-card-header .badge { font-weight: 600; color: #7c8aff; }
.image-card-header .card-status { font-size: 11px; }
.image-card-body {
  position: relative; min-height: 180px; display: flex; align-items: center; justify-content: center; background: #0b0d13;
}
.image-card-body img {
  width: 100%; height: auto; display: block; border-radius: 0; cursor: pointer; transition: opacity 0.2s; margin-top: 0;
}
.image-card-body img:hover { opacity: 0.95; }
.image-card-footer {
  padding: 8px 12px; font-size: 12px; color: #666; background: #141520;
  border-top: 1px solid #1e1f2e; display: flex; justify-content: space-between; align-items: center;
}
.image-card-footer a { color: #7c8aff; text-decoration: none; }
.image-card-footer a:hover { text-decoration: underline; }
.image-card-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; color: #888; font-size: 13px;
}
.image-card-spinner {
  width: 28px; height: 28px; border: 2px solid #2a2b3a; border-top-color: #7c8aff;
  border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.model-list::-webkit-scrollbar, .output-log::-webkit-scrollbar { width: 4px; }
.model-list::-webkit-scrollbar-thumb, .output-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .config-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="container">
  <h1>🧪 Flow2API 模型测试</h1>
  <p class="subtitle">选择模型，输入提示词，测试生成效果</p>

  <div class="config-bar">
    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="输入 API Key">
    <label>地址:</label>
    <input type="text" id="baseUrl" placeholder="http://localhost:8000" />
  </div>
  <p class="config-note">未填写 API Key 或模型列表加载失败时，会回退到内置候选模型；实际生成前仍需填写有效 API Key。</p>

  <div class="main-layout">
    <div class="sidebar" id="modelSidebar"></div>
    <div class="content">
      <div class="gen-panel">
        <h3 id="selectedModelName">请选择模型</h3>
        <div class="model-info" id="selectedModelInfo">从左侧列表选择一个模型开始测试</div>

        <div class="form-group">
          <label>提示词 (Prompt)</label>
          <textarea id="promptInput" placeholder="描述你想生成的内容...">一只可爱的橘猫趴在窗台上晒太阳，窗外是樱花盛开的春天</textarea>
        </div>

        <div class="form-group" id="imageCountGroup" style="display:none;">
          <label>数量 <span style="color:#666;font-size:12px;">(一次生成 1~4 张图片)</span></label>
          <div class="count-selector" id="imageCountSelector">
            <button type="button" class="count-btn active" data-count="1">1 张</button>
            <button type="button" class="count-btn" data-count="2">2 张</button>
            <button type="button" class="count-btn" data-count="3">3 张</button>
            <button type="button" class="count-btn" data-count="4">4 张</button>
          </div>
        </div>

        <div class="form-group" id="imageUploadGroup" style="display:none;">
          <label>上传图片 <span id="imageLimit" style="color:#666;font-size:12px;"></span></label>
          <div class="image-upload-area" id="imageUploadArea">
            <div class="image-upload-hint" id="imageHint">点击或拖拽上传图片</div>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>
          <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;">
        </div>

        <button class="btn-generate" id="btnGenerate" disabled>选择模型后开始生成</button>
      </div>

      <div class="output-panel">
        <h3><span class="status-dot status-idle" id="statusDot"></span> <span id="statusText">等待中</span></h3>
        <div class="output-log" id="outputLog">准备就绪，选择模型并点击生成按钮开始...</div>
        <div class="output-result" id="outputResult"></div>
      </div>
    </div>
  </div>
</div>

async function loadModels() {
  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  if (!baseUrl || !apiKey) {
    applyFallbackModels("missing_base_url_or_api_key");
    return;
  }
  try {
    const resp = await fetch(`${baseUrl}/v1/models`, {
      headers: { "Authorization": `Bearer ${apiKey}` }
    });
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const items = Array.isArray(data.data) ? data.data : [];
    if (!items.length) {
      applyFallbackModels("empty_model_catalog");
      return;
    }
    ALL_MODELS = {};
    items.forEach(m => { ALL_MODELS[m.id] = m.description; });
    renderSidebar();
  } catch (e) {
    console.error("加载模型失败:", e);
    applyFallbackModels(e.message || "load_failed");
  }
}

function renderSidebarFallback() {
  applyFallbackModels("legacy_fallback");
}

function getModelType(modelId) {
  if (modelId.includes("image") || modelId.startsWith("imagen")) return "image";
  return "video";
}

function getModelMeta(modelId) {
  // Determine supports_images, min/max from model name patterns
  const isOmni = modelId.startsWith("omni") || modelId.startsWith("omini");
  const isI2V = modelId.includes("i2v");
  const isR2V = modelId.includes("r2v");
  const isT2V = modelId.includes("t2v");
  const isImage = getModelType(modelId) === "image";

  if (isImage) return { type: "image", supportsImages: true, minImages: 0, maxImages: 5 };
  if (isOmni) return { type: "video", supportsImages: true, minImages: 0, maxImages: 3 };
  if (isI2V) return { type: "video", supportsImages: true, minImages: 1, maxImages: 2 };
  if (isR2V) return { type: "video", supportsImages: true, minImages: 0, maxImages: 3 };
  return { type: "video", supportsImages: false, minImages: 0, maxImages: 0 };
}

function renderSidebar() {
  const sidebar = document.getElementById("modelSidebar");
  sidebar.innerHTML = "";

  const modelIds = Object.keys(ALL_MODELS).sort();
  if (modelIds.length === 0) {
    sidebar.innerHTML = '<div class="model-section"><div class="model-list" style="border-radius:8px;"><div class="model-item" style="cursor:default;color:#888;">未获取到可用模型，请检查 API Key 或稍后重试</div></div></div>';
    return;
  }

  for (const [catName, catDef] of Object.entries(MODEL_CATEGORIES)) {
    const models = modelIds.filter(catDef.filter);
    if (models.length === 0) continue;

    const section = document.createElement("div");
    section.className = "model-section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.innerHTML = `<span>${catName} (${models.length})</span><span class="arrow">▼</span>`;

    const list = document.createElement("div");
    list.className = "model-list";

    models.forEach(modelId => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.dataset.model = modelId;

      const type = getModelType(modelId);
      const shortName = modelId.replace("gemini-3.1-flash-image-", "").replace("gemini-3.0-pro-image-", "").replace("imagen-4.0-generate-preview-", "");
      item.innerHTML = `<span>${shortName}</span><span class="model-tag ${type === 'image' ? 'tag-image' : 'tag-video'}">${type === 'image' ? '图片' : '视频'}</span>`;
      item.onclick = () => selectModel(modelId);
      list.appendChild(item);
    });

    title.onclick = () => {
      title.classList.toggle("collapsed");
      list.classList.toggle("hidden");
    };

    section.appendChild(title);
    section.appendChild(list);
    sidebar.appendChild(section);
  }
}

function selectModel(modelId) {
  STATE.selectedModel = modelId;
  STATE.modelConfig = getModelMeta(modelId);
  STATE.images = [];

  // Update sidebar active state
  document.querySelectorAll(".model-item").forEach(el => {
    el.classList.toggle("active", el.dataset.model === modelId);
  });

  // Update panel
  document.getElementById("selectedModelName").textContent = modelId;
  document.getElementById("selectedModelInfo").textContent = ALL_MODELS[modelId] || "";

  // Show/hide image upload
  const uploadGroup = document.getElementById("imageUploadGroup");
  const meta = STATE.modelConfig;
  if (meta.supportsImages) {
    uploadGroup.style.display = "block";
    const limitText = meta.type === "image" ? "可选，用于图生图" : `${meta.minImages}-${meta.maxImages}张`;
    document.getElementById("imageLimit").textContent = `(${limitText})`;
  } else {
    uploadGroup.style.display = "none";
  }

  // Show/hide image count
  const countGroup = document.getElementById("imageCountGroup");
  if (countGroup) {
    countGroup.style.display = meta.type === "image" ? "block" : "none";
  }

  // Reset image previews
  document.getElementById("imagePreviewList").innerHTML = "";
  document.getElementById("imageHint").style.display = "block";

  // Enable button
  updateGenerateButton();
}

function updateGenerateButton() {
  const btn = document.getElementById("btnGenerate");
  if (!STATE.selectedModel) {
    btn.disabled = true;
    btn.textContent = "选择模型后开始生成";
    return;
  }
  btn.disabled = STATE.generating;
  if (STATE.generating) {
    btn.textContent = "⏳ 生成中...";
    return;
  }
  const meta = STATE.modelConfig;
  if (meta && meta.type === "image") {
    const count = STATE.imageCount || 1;
    btn.textContent = count > 1 ? `🎨 生成图片 (${count}张)` : "🎨 生成图片";
  } else {
    btn.textContent = "🎬 生成视频";
  }
}

// Image count selector
document.querySelectorAll(".count-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (STATE.generating) return;
    const count = parseInt(btn.dataset.count, 10) || 1;
    STATE.imageCount = count;
    document.querySelectorAll(".count-btn").forEach(b => {
      b.classList.toggle("active", b === btn);
    });
    updateGenerateButton();
  });
});

// Image upload handling
const uploadArea = document.getElementById("imageUploadArea");
const fileInput = document.getElementById("imageFileInput");

uploadArea.onclick = (e) => {
  if (e.target.closest(".remove-btn")) return;
  fileInput.click();
};

uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = "#7c8aff"; };
uploadArea.ondragleave = () => { uploadArea.style.borderColor = "#2a2b3a"; };
uploadArea.ondrop = (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = "#2a2b3a";
  handleFiles(e.dataTransfer.files);
};

fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ""; };

function handleFiles(files) {
  const maxImages = STATE.modelConfig ? STATE.modelConfig.maxImages : 5;
  for (const file of files) {
    if (STATE.images.length >= maxImages) break;
    if (!file.type.startsWith("image/")) continue;

    const reader = new FileReader();
    reader.onload = (e) => {
      STATE.images.push(e.target.result);
      renderImagePreviews();
    };
    reader.readAsDataURL(file);
  }
}

function renderImagePreviews() {
  const list = document.getElementById("imagePreviewList");
  const hint = document.getElementById("imageHint");
  list.innerHTML = "";
  hint.style.display = STATE.images.length ? "none" : "block";

  STATE.images.forEach((dataUrl, idx) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";
    item.innerHTML = `<img src="${dataUrl}" alt="preview"><button class="remove-btn" onclick="removeImage(${idx})">×</button>`;
    list.appendChild(item);
  });
}

function removeImage(idx) {
  STATE.images.splice(idx, 1);
  renderImagePreviews();
}

// Generation
document.getElementById("btnGenerate").onclick = generate;

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function generate() {
  if (!STATE.selectedModel || STATE.generating) return;

  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) { alert("请输入提示词"); return; }
  if (!apiKey) { alert("请输入 API Key"); return; }
  if (!baseUrl) { alert("请输入服务地址"); return; }

  const meta = STATE.modelConfig;
  const isImageModel = meta && meta.type === "image";
  const totalCount = isImageModel ? Math.max(1, Math.min(4, STATE.imageCount || 1)) : 1;

  STATE.generating = true;
  updateGenerateButton();
  document.querySelectorAll(".count-btn").forEach(b => b.disabled = true);

  const dot = document.getElementById("statusDot");
  dot.className = "status-dot status-running";
  document.getElementById("statusText").textContent = totalCount > 1 ? `生成中 (0/${totalCount})...` : "生成中...";

  const log = document.getElementById("outputLog");
  log.textContent = "";
  const resultDiv = document.getElementById("outputResult");
  resultDiv.innerHTML = "";

  const startTime = Date.now();
  const timeStr = () => new Date().toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });

  log.textContent += `[${timeStr()}] 模型: ${STATE.selectedModel}${totalCount > 1 ? ` (数量: ${totalCount} 张)` : ''}\n`;
  log.textContent += `[${timeStr()}] 提示词: ${prompt.substring(0, 100)}${prompt.length > 100 ? '...' : ''}\n`;
  log.textContent += `[${timeStr()}] ${totalCount > 1 ? `开始并发发起 ${totalCount} 个生成请求...\n\n` : '开始请求...\n'}`;

  // Build messages
  const content = [];
  content.push({ type: "text", text: prompt });
  STATE.images.forEach(dataUrl => {
    content.push({ type: "image_url", image_url: { url: dataUrl } });
  });
  const messages = [{ role: "user", content: content.length === 1 ? prompt : content }];
  const body = { model: STATE.selectedModel, messages, stream: true };

  // Initialize result display cards for images
  if (isImageModel) {
    const grid = document.createElement("div");
    grid.className = "image-grid";
    grid.dataset.cols = String(totalCount);
    for (let i = 1; i <= totalCount; i++) {
      const card = document.createElement("div");
      card.className = "image-card";
      card.id = `imageCard_${i}`;
      card.innerHTML = `
        <div class="image-card-header">
          <span class="badge">图片 #${i}</span>
          <span class="card-status" id="cardStatus_${i}" style="color:#facc15;">生成中...</span>
        </div>
        <div class="image-card-body" id="cardBody_${i}">
          <div class="image-card-loading">
            <div class="image-card-spinner"></div>
            <div>正在生成第 ${i} 张...</div>
          </div>
        </div>
        <div class="image-card-footer" id="cardFooter_${i}">
          <span style="color:#666;">处理中...</span>
        </div>
      `;
      grid.appendChild(card);
    }
    resultDiv.appendChild(grid);
  }

  let completedCount = 0;
  let successCount = 0;

  const runTask = async (taskIndex) => {
    const taskStartTime = Date.now();
    const prefix = totalCount > 1 ? `[#${taskIndex}] ` : '';

    const appendTaskLog = (text) => {
      if (totalCount === 1) {
        log.textContent += text;
      } else {
        const lines = text.split("\n");
        const formatted = lines.map((l, idx) => {
          if (idx === lines.length - 1 && l === '') return '';
          return `${prefix}${l}`;
        }).join("\n");
        log.textContent += formatted + (text.endsWith("\n") ? "\n" : "");
      }
      log.scrollTop = log.scrollHeight;
    };

    try {
      const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${errText}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let fullContent = "";
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6).trim();
          if (data === "[DONE]") continue;

          try {
            const parsed = JSON.parse(data);
            if (parsed.error) {
              appendTaskLog(`\n❌ 错误: ${JSON.stringify(parsed.error)}\n`);
              continue;
            }
            const choices = parsed.choices || [];
            if (choices.length > 0) {
              const delta = choices[0].delta || {};
              const chunkContent = delta.reasoning_content || delta.content || "";
              if (chunkContent) {
                fullContent += chunkContent;
                appendTaskLog(chunkContent);
              }
            }
          } catch (e) {
            // skip unparseable chunks
          }
        }
      }

      const taskElapsed = ((Date.now() - taskStartTime) / 1000).toFixed(1);
      appendTaskLog(`\n✅ 完成，耗时 ${taskElapsed}s\n`);

      if (isImageModel) {
        const imgRegex = /!\[.*?\]\((.*?)\)/g;
        let match = imgRegex.exec(fullContent);
        const cardStatus = document.getElementById(`cardStatus_${taskIndex}`);
        const cardBody = document.getElementById(`cardBody_${taskIndex}`);
        const cardFooter = document.getElementById(`cardFooter_${taskIndex}`);

        if (match && match[1]) {
          const imgUrl = match[1];
          successCount++;
          if (cardStatus) {
            cardStatus.textContent = `完成 (${taskElapsed}s)`;
            cardStatus.style.color = "#4ade80";
          }
          if (cardBody) {
            cardBody.innerHTML = `<img src="${imgUrl}" alt="生成结果 #${taskIndex}" loading="lazy" title="点击新窗口查看原图" onclick="window.open('${imgUrl}', '_blank')">`;
          }
          if (cardFooter) {
            cardFooter.innerHTML = `<span>耗时 ${taskElapsed}s</span><a href="${imgUrl}" target="_blank">查看原图 ↗</a>`;
          }
        } else {
          if (cardStatus) {
            cardStatus.textContent = `无图片输出`;
            cardStatus.style.color = "#facc15";
          }
          if (cardBody) {
            cardBody.innerHTML = `<div style="padding:16px;color:#aaa;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow-y:auto;">${escapeHtml(fullContent)}</div>`;
          }
          if (cardFooter) {
            cardFooter.innerHTML = `<span>耗时 ${taskElapsed}s</span><span style="color:#888;">未检测到图片</span>`;
          }
        }
      } else {
        renderResult(fullContent);
        successCount++;
      }

    } catch (e) {
      const taskElapsed = ((Date.now() - taskStartTime) / 1000).toFixed(1);
      appendTaskLog(`\n❌ 请求失败: ${e.message}\n`);
      if (isImageModel) {
        const cardStatus = document.getElementById(`cardStatus_${taskIndex}`);
        const cardBody = document.getElementById(`cardBody_${taskIndex}`);
        const cardFooter = document.getElementById(`cardFooter_${taskIndex}`);
        if (cardStatus) {
          cardStatus.textContent = `失败`;
          cardStatus.style.color = "#f87171";
        }
        if (cardBody) {
          cardBody.innerHTML = `<div style="padding:20px 14px;color:#f87171;font-size:13px;text-align:center;">生成失败<br><span style="color:#888;font-size:11px;margin-top:6px;display:block;word-break:break-all;">${escapeHtml(e.message)}</span></div>`;
        }
        if (cardFooter) {
          cardFooter.innerHTML = `<span>耗时 ${taskElapsed}s</span><span style="color:#f87171;">失败</span>`;
        }
      }
    } finally {
      completedCount++;
      if (totalCount > 1) {
        document.getElementById("statusText").textContent = `生成中 (${completedCount}/${totalCount} 完成)...`;
      }
    }
  };

  try {
    const taskPromises = [];
    for (let i = 1; i <= totalCount; i++) {
      taskPromises.push(runTask(i));
    }
    await Promise.all(taskPromises);

    const totalElapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    if (totalCount > 1) {
      log.textContent += `\n[${timeStr()}] 全部任务结束，成功 ${successCount}/${totalCount}，总耗时 ${totalElapsed}s\n`;
      log.scrollTop = log.scrollHeight;
    }

    if (successCount === totalCount) {
      dot.className = "status-dot status-done";
      document.getElementById("statusText").textContent = totalCount > 1 ? `全部完成 (${successCount}/${totalCount} 张，${totalElapsed}s)` : `完成 (${totalElapsed}s)`;
    } else if (successCount > 0) {
      dot.className = "status-dot status-done";
      document.getElementById("statusText").textContent = `部分完成 (${successCount}/${totalCount} 成功，${totalElapsed}s)`;
    } else {
      dot.className = "status-dot status-error";
      document.getElementById("statusText").textContent = `失败 (${totalElapsed}s)`;
    }

  } finally {
    STATE.generating = false;
    updateGenerateButton();
    document.querySelectorAll(".count-btn").forEach(b => b.disabled = false);
  }
}

function renderResult(content) {
  const resultDiv = document.getElementById("outputResult");
  resultDiv.innerHTML = "";

  // Extract markdown images
  const imgRegex = /!\[.*?\]\((.*?)\)/g;
  let match;
  while ((match = imgRegex.exec(content)) !== null) {
    const img = document.createElement("img");
    img.src = match[1];
    img.alt = "生成结果";
    img.loading = "lazy";
    resultDiv.appendChild(img);
  }

  // Extract video tags
  const videoRegex = /<video[^>]+src=['"]([^'"]+)['"]/gi;
  while ((match = videoRegex.exec(content)) !== null) {
    const video = document.createElement("video");
    video.src = match[1];
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    resultDiv.appendChild(video);
  }

  // If no media found, show raw text
  if (resultDiv.children.length === 0 && content.trim()) {
    const pre = document.createElement("pre");
    pre.style.cssText = "color:#aaa;font-size:13px;white-space:pre-wrap;word-break:break-all;";
    pre.textContent = content;
    resultDiv.appendChild(pre);
  }
}

// Auto-detect base URL
(function() {
  const baseUrlInput = document.getElementById("baseUrl");
  const apiKeyInput = document.getElementById("apiKey");
  baseUrlInput.value = window.location.origin;
  baseUrlInput.addEventListener("change", loadModels);
  apiKeyInput.addEventListener("change", loadModels);
  loadModels();
})();
